<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ray’s Hotels</title>
<style>
	:root {
		--columns: 2;
		--rows: 4;
	}

	html, body {
		background: #0b0d12;
		color: #f4f1ec;
		font-family: system-ui, sans-serif;
		height: 100%;
		margin: 0;
	}

	body {
		box-sizing: border-box;
		display: grid;
		gap: 8px;
		grid-template-columns: repeat(var(--columns), 1fr);
		grid-template-rows: repeat(var(--rows), 1fr);
		padding: 8px;
	}

	.tile {
		background: #15181f;
		border: 1px solid #2a2f3a;
		border-radius: 10px;
		display: flex;
		flex-direction: column;
		min-height: 0;
		overflow: hidden;
	}

	.label {
		background: #1f2430;
		font-size: 16px;
		padding: 4px 10px;
	}

	.label b {
		color: #9aa4b5;
		margin-right: 6px;
	}

	.frame {
		flex: 1;
		overflow: hidden;
		position: relative;
	}

	.frame iframe {
		border: 0;
		height: 2000px;
		left: 0;
		position: absolute;
		top: 0;
		transform-origin: 0 0;
		width: 1000px;
	}

	.empty {
		align-items: center;
		color: #5c6475;
		display: flex;
		font-size: 18px;
		height: 100%;
		justify-content: center;
	}
</style>
</head>
<body>
<!-- tiles -->
<script>
	const PAGE_WIDTH = 1000;

	// place(tile, iframe): fits the page's sections in the tile; false while
	// the page has no sections laid out yet.
	const place = (tile, iframe = [...tile.querySelectorAll('.frame iframe')].pop()) => {
		const frame = tile.querySelector('.frame');

		if (!iframe || !iframe.contentDocument) {
			return false;
		}

		const columns = getComputedStyle(document.documentElement).getPropertyValue('--columns').trim();
		const isSection = (element) => columns === '1' ? [...element.classList].some((name) => /^rays-[a-z-]+$/.test(name)) : element.matches('.rays-header, .rays-offer');
		const sections = [...iframe.contentDocument.querySelectorAll('[class*="rays-"]')].filter(isSection).map((section) => section.getBoundingClientRect()).filter((box) => box.width > 0 && box.height > 0);

		if (!sections.length) {
			return false;
		}

		const top = Math.min(...sections.map((section) => section.top)) + iframe.contentWindow.scrollY;
		const bottom = Math.max(...sections.map((section) => section.bottom)) + iframe.contentWindow.scrollY;

		const scale = Math.min(frame.clientWidth / PAGE_WIDTH, frame.clientHeight / (bottom - top));
		const left = (frame.clientWidth - PAGE_WIDTH * scale) / 2 / scale;

		iframe.style.transform = `scale(${scale}) translate(${left}px, ${-top}px)`;
		iframe.style.clipPath = `inset(${top}px 0 calc(100% - ${bottom}px) 0)`;

		return true;
	};

	const show = (tile, path) => {
		const frame = tile.querySelector('.frame');
		const iframe = document.createElement('iframe');

		iframe.scrolling = 'no';
		iframe.style.visibility = 'hidden';
		iframe.src = `${path}?t=${Date.now()}`;

		iframe.addEventListener('load', () => {
			let tries = 0;

			const ready = () => {
				if (!place(tile, iframe) && ++tries < 25) {
					setTimeout(ready, 200);

					return;
				}

				iframe.style.visibility = 'visible';

				for (const old of frame.querySelectorAll('iframe, .empty')) {
					if (old !== iframe) {
						old.remove();
					}
				}

				setTimeout(() => place(tile, iframe), 1500);
			};

			ready();
		});

		frame.appendChild(iframe);
	};

	const key = (html) => (html.match(/rays-(header__city|offer__title|breakfast)[^>]*>[^<]*/g) || []).join('|');

	const poll = async () => {
		for (const tile of document.querySelectorAll('.tile')) {
			const path = tile.dataset.path;

			try {
				const response = await fetch(path, {cache: 'no-store', credentials: 'omit'});

				if (!response.ok) {
					continue;
				}

				const current = key(await response.text());

				if (current && current !== tile.dataset.key) {
					tile.dataset.key = current;

					show(tile, path);
				}
			}
			catch (error) {
				// The portal is busy; try again on the next round.
			}
		}

		setTimeout(poll, 1500);
	};

	addEventListener('resize', () => document.querySelectorAll('.tile').forEach((tile) => place(tile)));

	poll();
</script>
</body>
</html>
