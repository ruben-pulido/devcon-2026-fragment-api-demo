<section class="rays-breakfast" style="--rays-accent: ${configuration.accentColor};">
	<div class="rays-breakfast__inner">
		<svg aria-hidden="true" class="rays-breakfast__icon" viewBox="0 0 48 48"><path d="M10 22h24v8a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="3" /><path d="M34 25h3a5 5 0 0 1 0 10h-4" fill="none" stroke="currentColor" stroke-width="3" /><path d="M17 16c-2-3 2-4 0-8M24 16c-2-3 2-4 0-8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3" /></svg>

		<div class="rays-breakfast__body">
			<p class="rays-breakfast__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Good morning</p>

			<h2 class="rays-breakfast__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Breakfast</h2>

			<div class="rays-breakfast__row">
				<span class="rays-breakfast__day" data-lfr-editable-id="weekdays" data-lfr-editable-type="text">Monday to Friday</span>
				<span class="rays-breakfast__time" data-lfr-editable-id="weekdays-hours" data-lfr-editable-type="text">7:00 - 10:30</span>
			</div>

			<div class="rays-breakfast__row">
				<span class="rays-breakfast__day" data-lfr-editable-id="weekend" data-lfr-editable-type="text">Saturday and Sunday</span>
				<span class="rays-breakfast__time" data-lfr-editable-id="weekend-hours" data-lfr-editable-type="text">8:00 - 11:30</span>
			</div>

			<span class="rays-breakfast__cta">${configuration.ctaLabel}</span>
		</div>
	</div>
</section>
