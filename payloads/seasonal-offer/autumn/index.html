<section class="rays-offer" style="--rays-accent: ${configuration.accentColor};">
	<div class="rays-offer__inner">
		<img alt="" class="rays-offer__image" src="[resources:images/autumn-getaway.svg]" />

		<div class="rays-offer__body">
			<p class="rays-offer__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Autumn getaway</p>

			<h2 class="rays-offer__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Three nights for the price of two</h2>

			<p class="rays-offer__text" data-lfr-editable-id="text" data-lfr-editable-type="rich-text">Golden leaves and long walks, in every Ray’s hotel.</p>

			<span class="rays-offer__cta">${configuration.ctaLabel}</span>
		</div>
	</div>
</section>
