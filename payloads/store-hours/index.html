<section class="rays-hours" style="--rays-accent: ${configuration.accentColor};">
	<div class="rays-hours__inner">
		<svg aria-hidden="true" class="rays-hours__icon" viewBox="0 0 48 48"><circle cx="24" cy="24" fill="none" r="20" stroke="currentColor" stroke-width="3" /><path d="M24 13v12l8 5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3" /></svg>

		<div class="rays-hours__body">
			<p class="rays-hours__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Visit us</p>

			<h2 class="rays-hours__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Opening hours</h2>

			<div class="rays-hours__row">
				<span class="rays-hours__day" data-lfr-editable-id="weekdays" data-lfr-editable-type="text">Monday to Friday</span>
				<span class="rays-hours__time" data-lfr-editable-id="weekdays-hours" data-lfr-editable-type="text">7:00 - 20:00</span>
			</div>

			<div class="rays-hours__row">
				<span class="rays-hours__day" data-lfr-editable-id="weekend" data-lfr-editable-type="text">Saturday and Sunday</span>
				<span class="rays-hours__time" data-lfr-editable-id="weekend-hours" data-lfr-editable-type="text">8:00 - 18:00</span>
			</div>

			<span class="rays-hours__cta">${configuration.ctaLabel}</span>
		</div>
	</div>
</section>
