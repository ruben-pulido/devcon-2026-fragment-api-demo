<header class="rays-header" style="--rays-accent: @ACCENT@;">
	<div class="rays-header__inner">
		<img alt="Ray" class="rays-header__ray" src="[resources:@RAY@]" />

		<div class="rays-header__body">
			<p class="rays-header__brand">Ray’s Hotels</p>

			<h1 class="rays-header__city" data-lfr-editable-id="city" data-lfr-editable-type="text">@CITY@</h1>

			<p class="rays-header__tagline" data-lfr-editable-id="tagline" data-lfr-editable-type="text">@TAGLINE@</p>
		</div>

		<img alt="@CITY@" class="rays-header__skyline" src="[resources:@IMAGE@]" />
	</div>
</header>
