<section class="acme-promo" style="--acme-accent: ${configuration.accentColor};">
	<img alt="" class="acme-promo__image" src="[resources:autumn-cup.svg]" />

	<div class="acme-promo__body">
		<p class="acme-promo__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Autumn special</p>

		<h2 class="acme-promo__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Pumpkin Spice Latte is back</h2>

		<p class="acme-promo__text" data-lfr-editable-id="text" data-lfr-editable-type="rich-text">Warm up your mornings in every Acme Coffee store.</p>

		<span class="acme-promo__cta">${configuration.ctaLabel}</span>
	</div>
</section>
