<section class="rays-promo" style="--rays-accent: ${configuration.accentColor};">
	<div class="rays-promo__inner">
		<img alt="" class="rays-promo__image" src="[resources:autumn-cup.svg]" />

		<div class="rays-promo__body">
			<p class="rays-promo__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Autumn special</p>

			<h2 class="rays-promo__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Pumpkin Spice Latte is back</h2>

			<p class="rays-promo__text" data-lfr-editable-id="text" data-lfr-editable-type="rich-text">Warm up your mornings in every Ray’s Coffee store.</p>

			<span class="rays-promo__cta">${configuration.ctaLabel}</span>
		</div>
	</div>
</section>
